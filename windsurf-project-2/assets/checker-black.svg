<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 3D Spherical body gradient for black (onyx/marble look) -->
    <radialGradient id="sphereBodyB" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4A4A52"/>
      <stop offset="20%" stop-color="#3A3A42"/>
      <stop offset="45%" stop-color="#2A2A32"/>
      <stop offset="70%" stop-color="#1A1A22"/>
      <stop offset="90%" stop-color="#0F0F15"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    
    <!-- Metallic rim lighting -->
    <linearGradient id="rimLightB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(100,100,110,0.8)"/>
      <stop offset="50%" stop-color="rgba(60,60,70,0.3)"/>
      <stop offset="100%" stop-color="rgba(40,40,50,0.5)"/>
    </linearGradient>
    
    <!-- Metallic specular highlight -->
    <radialGradient id="specularB" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="rgba(180,180,190,0.7)"/>
      <stop offset="30%" stop-color="rgba(120,120,130,0.3)"/>
      <stop offset="60%" stop-color="rgba(80,80,90,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    
    <!-- Soft drop shadow -->
    <filter id="softShadowB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Inner depth shadow -->
    <radialGradient id="innerShadowB" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="85%" stop-color="rgba(0,0,0,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>
  </defs>
  
  <!-- Main sphere with shadow -->
  <circle cx="64" cy="66" r="54" fill="rgba(0,0,0,0.25)" filter="url(#softShadowB)"/>
  
  <!-- 3D spherical body -->
  <circle cx="64" cy="64" r="54" fill="url(#sphereBodyB)"/>
  
  <!-- Rim highlight -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#rimLightB)" stroke-width="2"/>
  
  <!-- Inner depth shadow at bottom -->
  <circle cx="64" cy="64" r="54" fill="url(#innerShadowB)"/>
  
  <!-- Specular highlight (metallic gloss) -->
  <ellipse cx="48" cy="44" rx="18" ry="14" fill="url(#specularB)" transform="rotate(-20 48 44)"/>
  
  <!-- Secondary smaller highlight -->
  <ellipse cx="75" cy="58" rx="8" ry="6" fill="rgba(100,100,110,0.3)" transform="rotate(-20 75 58)"/>
</svg>
